name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/add-model-endpoint-USRBM]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zenith-finanzas/package-lock.json

      # ── Zenith Finanzas (app unificada: plataforma + Mango Tycoon) ────────
      - name: Install deps
        run: npm ci
        working-directory: zenith-finanzas

      - name: Build
        run: npm run build
        working-directory: zenith-finanzas
        env:
          VITE_BASE_PATH: /Dazvohg/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Deploy ────────────────────────────────────────────────────────────
      - name: Assemble gh-pages output
        run: |
          mkdir -p gh-pages
          cp -r zenith-finanzas/dist/. gh-pages/
          # SPA fallback: redirigir rutas no encontradas al index
          cp gh-pages/index.html gh-pages/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          force_orphan: true
