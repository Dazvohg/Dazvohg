version: "3.9"

# Una sola app unificada: Zenith Finanzas + Mango Tycoon integrado.
# Arrancá todo con: docker-compose up
#
# URLs:
#   Zenith + Mango:  http://localhost:5173
#   API backend:     http://localhost:8000

services:
  # ── Zenith AI Backend ─────────────────────────────────────────────────────
  zenith-backend:
    build:
      context: ./zenith-backend
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      ZENITH_API_KEY: ""
      ZENITH_CHECKPOINT: ""
      RELOAD: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── App unificada: Zenith Finanzas + Mango Tycoon ────────────────────────
  app:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./zenith-finanzas:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_ZENITH_API_URL: "http://localhost:8000"
      VITE_SUPABASE_URL: "${VITE_SUPABASE_URL:-https://placeholder.supabase.co}"
      VITE_SUPABASE_ANON_KEY: "${VITE_SUPABASE_ANON_KEY:-placeholder}"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      zenith-backend:
        condition: service_healthy
